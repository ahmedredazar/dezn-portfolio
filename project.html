  function renderProject() {
    const lang = (window.DEZN_I18N && window.DEZN_I18N.getLang()) || 'ar';
    const base = PROJECTS[id] || PROJECTS.villa;
    const en = PROJECTS_EN[id] || PROJECTS_EN.villa;
    const p = lang === 'en' ? Object.assign({}, base, en) : base;

    document.title = p.title + ' | DEZN';
    document.getElementById('title').textContent = p.title;
    document.getElementById('bcTitle').textContent = p.title;
    document.getElementById('bcCat').textContent = p.catLabel;
    document.getElementById('meta').textContent = p.meta;
    document.getElementById('mainImg').src = p.imgs[0];
    document.getElementById('mainImg').alt = p.title;
    document.getElementById('body').innerHTML = p.body;
    document.getElementById('specs').innerHTML = p.specs.map(([k,v]) =>
      `<div class="spec-item"><strong>${k}</strong><span>${v}</span></div>`
    ).join('');
    const gal = document.getElementById('gallery');
    gal.innerHTML = p.imgs.slice(1).map(src =>
      `<img src="${src}" alt="" loading="lazy" data-full="${src}">`
    ).join('');
    gal.querySelectorAll('img').forEach(img => {
      img.onclick = () => openLb(img.dataset.full || img.src);
    });
    document.getElementById('mainImg').onclick = () => openLb(p.imgs[0]);

    // Related titles
    const related = Object.entries(PROJECTS)
      .filter(([k, v]) => k !== id && v.category === base.category)
      .slice(0, 3);
    const more = related.length < 3
      ? Object.entries(PROJECTS).filter(([k]) => k !== id && !related.find(r => r[0] === k)).slice(0, 3 - related.length)
      : [];
    const allRel = [...related, ...more].slice(0, 4);
    document.getElementById('related').innerHTML = allRel.map(([k, v]) => {
      const thumb = v.imgs[0].replace(/w=\d+/, 'w=400').replace(/h=\d+/, 'h=400');
      const title = lang === 'en' && PROJECTS_EN[k] ? PROJECTS_EN[k].title : v.title;
      return `<a href="project.html?id=${k}" class="suggestion-card">
        <img src="${thumb}" alt="${title}" loading="lazy">
        <p>${title}</p>
      </a>`;
    }).join('');
  }

  const id = new URLSearchParams(location.search).get('id') || 'villa';
  // Lightbox
  const lb = document.getElementById('lightbox');
  function openLb(src) {
    document.getElementById('lbImg').src = src;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('lbClose').onclick = closeLb;
  lb.onclick = e => { if (e.target === lb) closeLb(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

  renderProject();
  window.addEventListener('dezn-lang', renderProject);

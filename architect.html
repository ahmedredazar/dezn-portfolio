      worksIntro: 'Houses and museums that embodied integration with nature and site.'
    },
    hadid: {
      title: 'Zaha Hadid',
      meta: 'Iraq / Britain · 1950 – 2016',
      body: `<p>Zaha Hadid was an Iraqi-British architect, the first woman to win the Pritzker Prize (2004), and a leading face of contemporary architecture worldwide.</p><p>She was known for fluid, dynamic forms and advanced software for complex structures.</p>`,
      worksIntro: 'Bold projects that made her name synonymous with contemporary fluid architecture.'
    },
    fathy: {
      title: 'Hassan Fathy',
      meta: 'Egypt · 1900 – 1989',
      body: `<p>Hassan Fathy was an Egyptian architect and pioneer of “architecture for the poor” and social and environmental sustainability long before the terms were widespread.</p><p>He advocated local materials (mud brick) and climate-appropriate traditional techniques instead of costly imported Western solutions.</p>`,
      worksIntro: 'Projects and ideas that linked architecture to people, local material, and climate.'
    },
    contemporary: {
      title: 'Contemporary generation · Arab world',
      meta: 'Architects and practices in the region',
      body: `<p>Contemporary architects in the Arab world blend local identity (climate, privacy, ornament, courtyard) with modern construction and software.</p><p>At DEZN we follow this dialogue and aim for solutions suited to the Egyptian and Arab context with strong design and visual presentation.</p>`,
      worksIntro: 'Directions and projects that represent the dialogue of identity and technology in the region.'
    }
  };

  const WORKS_EN_TITLES = {
    'gaudi-sagrada': 'Sagrada Família',
    'gaudi-guell': 'Park Güell',
    'gaudi-batllo': 'Casa Batlló',
    'gaudi-mila': 'Casa Milà (La Pedrera)',
    'corbusier-savoye': 'Villa Savoye',
    'corbusier-unite': 'Unité d\'Habitation · Marseille',
    'corbusier-ronchamp': 'Notre-Dame du Haut',
    'corbusier-chandigarh': 'Chandigarh Complex',
    'wright-fallingwater': 'Fallingwater',
    'wright-guggenheim': 'Guggenheim Museum',
    'wright-prairie': 'Prairie Houses',
    'wright-taliesin': 'Taliesin',
    'hadid-aliyev': 'Heydar Aliyev Center',
    'hadid-aquatics': 'London Aquatics Centre',
    'hadid-maxxi': 'MAXXI Museum',
    'hadid-soho': 'Galaxy Soho · Beijing',
    'fathy-gourna': 'New Gourna Village',
    'fathy-book': 'Architecture for the Poor (book)',
    'fathy-dar': 'Dar al-Islam · New Mexico',
    'fathy-housing': 'Housing & mosque projects',
    'contemporary-residential': 'Contemporary residential projects',
    'contemporary-cultural': 'Cultural & public buildings',
    'contemporary-sustain': 'Sustainability & climate',
    'contemporary-hybrid': 'Heritage and technology'
  };

  function renderArchitect() {
    const lang = (window.DEZN_I18N && window.DEZN_I18N.getLang()) || 'ar';
    const base = ARCHITECTS[id] || ARCHITECTS.gaudi;
    const en = ARCHITECTS_EN[id] || ARCHITECTS_EN.gaudi;
    const a = lang === 'en' ? Object.assign({}, base, {
      title: en.title, meta: en.meta, body: en.body, worksIntro: en.worksIntro
    }) : base;

    document.title = a.title + ' | DEZN';
    document.getElementById('title').textContent = a.title;
    document.getElementById('bcTitle').textContent = a.title;
    document.getElementById('meta').textContent = a.meta;
    document.getElementById('body').innerHTML = a.body;
    const wh = document.getElementById('worksHeading');
    const prefix = (window.DEZN_I18N && window.DEZN_I18N.t('works.section')) || 'أعمال تاريخية';
    wh.textContent = prefix + ' — ' + a.title;
    document.getElementById('worksIntro').textContent = a.worksIntro || '';

    document.getElementById('worksGrid').innerHTML = (base.works || []).map(w => {
      const title = lang === 'en' && WORKS_EN_TITLES[w.id] ? WORKS_EN_TITLES[w.id] : w.title;
      const desc = lang === 'en' ? (w.descEn || w.desc) : w.desc;
      return `<a href="work.html?id=${w.id}" class="work-card">
      <div class="work-img"><img src="${w.img}" alt="${title}" loading="lazy"></div>
      <div class="work-info">
        <h3>${title}</h3>
        <span class="work-year">${w.year}</span>
        <p>${desc}</p>
      </div>
    </a>`;
    }).join('');
  }

  const id = new URLSearchParams(location.search).get('id') || 'gaudi';
  renderArchitect();
  window.addEventListener('dezn-lang', renderArchitect);
  </script>
  <script src="./script.js"></script>
</body>
</html>

  const w = WORKS[id] || WORKS['gaudi-sagrada'];

  document.title = w.title + ' | DEZN';
  document.getElementById('title').textContent = w.title;
  document.getElementById('bcTitle').textContent = w.title;
  document.getElementById('meta').textContent = w.meta;
  document.getElementById('mainImg').src = w.imgs[0];
  document.getElementById('mainImg').alt = w.title;
  document.getElementById('body').innerHTML = w.body;

  const archLink = 'architect.html?id=' + w.architectId;
  const bcArch = document.getElementById('bcArch');
  bcArch.textContent = w.architectName;
  bcArch.href = archLink;
  document.getElementById('backArch').href = archLink + '#works';

  document.getElementById('specs').innerHTML = w.specs.map(([k,v]) =>
    `<div class="spec-item"><strong>${k}</strong><span>${v}</span></div>`
  ).join('');

  const gal = document.getElementById('gallery');
  gal.innerHTML = w.imgs.slice(1).map(src =>
    `<img src="${src}" alt="" loading="lazy" data-full="${src}">`
  ).join('');

  // Lightbox
  const lb = document.getElementById('lightbox');
  function openLb(src) {
    document.getElementById('lbImg').src = src;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('mainImg').onclick = () => openLb(w.imgs[0]);
  gal.querySelectorAll('img').forEach(img => {
    img.onclick = () => openLb(img.dataset.full || img.src);
  });
  document.getElementById('lbClose').onclick = closeLb;
  lb.onclick = e => { if (e.target === lb) closeLb(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

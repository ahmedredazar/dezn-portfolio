  <script>
  const SERVICES = {
    architecture: {
      title: 'تصميم معماري',
      meta: 'من الفكرة إلى المخططات التنفيذية',
      body: `
        <p>نقدم خدمة التصميم المعماري المتكامل للمشاريع السكنية والتجارية والعامة، من المفهوم الأولي حتى المخططات التنفيذية القابلة للتنفيذ.</p>
        <p>نركز على الوظيفة، الحركة، الإضاءة الطبيعية، والتكامل مع الموقع والمناخ، مع الحفاظ على جمالية واضحة وهوية معمارية.</p>
        <p><strong>ما يشمله العمل:</strong></p>
        <ul>
          <li>دراسة الموقع والبرنامج الوظيفي</li>
          <li>مخططات أولية ومفاهيم تصميمية</li>
          <li>مخططات معمارية تفصيلية (مساقط، واجهات، قطاعات)</li>
          <li>تنسيق مع التخصصات الإنشائية والكهربائية والميكانيكية عند الحاجة</li>
          <li>تقديم بصري (رسومات ورندر) لدعم القرار</li>
        </ul>
        <p>الأدوات: AutoCAD · Revit · SketchUp وغيرها حسب طبيعة المشروع.</p>
      `,
      specs: [
        ['النوع', 'سكني / تجاري / عام'],
        ['المخرجات', 'مخططات + تصور'],
        ['الأدوات', 'Revit · AutoCAD']
      ]
    },
    interior: {
      title: 'تصميم داخلي',
      meta: 'فراغات متناسقة · خامات · إضاءة · أثاث',
      body: `
        <p>تصميم داخلي يربط الوظيفة بالجمال: توزيع الفراغات، اختيار الخامات والألوان، الإضاءة، والأثاث بما يناسب أسلوب حياة العميل وطبيعة المكان.</p>
        <p>نهتم بالتفاصيل التنفيذية حتى يصبح التصميم قابلاً للتنفيذ دون مفاجآت في الموقع.</p>
        <p><strong>ما يشمله العمل:</strong></p>
        <ul>
          <li>تحليل الاحتياجات وأسلوب الاستخدام</li>
          <li>مخططات توزيع الأثاث والحركة</li>
          <li>لوحة خامات وألوان (Mood Board)</li>
          <li>تفاصيل تنفيذية للأسقف والجدران والأرضيات</li>
          <li>اقتراحات أثاث وإضاءة وتصور ثلاثي الأبعاد</li>
        </ul>
        <p>مناسب للشقق، الفلل، المكاتب، والمساحات التجارية الصغيرة.</p>
      `,
      specs: [
        ['النوع', 'سكني / مكتبي'],
        ['المخرجات', 'مخططات + Mood Board'],
        ['الأدوات', '3ds Max · AutoCAD']
      ]
    },
    visualization: {
      title: 'تصور ثلاثي الأبعاد',
      meta: 'رندر ومرئيات معمارية عالية الجودة',
      body: `
        <p>رندر ومرئيات معمارية تساعد العميل والمستثمر على رؤية المشروع قبل التنفيذ: إضاءة واقعية، خامات، ومشاهد داخلية وخارجية.</p>
        <p>نستخدم أدوات متقدمة لإخراج صور وفيديوهات قصيرة تدعم العروض والتسويق والموافقات.</p>
        <p><strong>ما يشمله العمل:</strong></p>
        <ul>
          <li>نمذجة ثلاثية الأبعاد من المخططات</li>
          <li>رندر خارجي وداخلي بجودة عالية</li>
          <li>مشاهد ليلية ونهارية حسب الطلب</li>
          <li>جولات افتراضية أو فيديو قصير (اختياري)</li>
          <li>تعديلات على الإضاءة والخامات حسب ملاحظات العميل</li>
        </ul>
        <p>الأدوات: 3ds Max · V-Ray / Corona · Adobe Suite.</p>
      `,
      specs: [
        ['النوع', 'رندر / فيديو'],
        ['المخرجات', 'صور عالية الدقة'],
        ['الأدوات', '3ds Max · V-Ray']
      ]
    }
  };


  const SERVICES_EN = {
    architecture: {
      title: 'Architectural Design',
      meta: 'From concept to working drawings',
      body: `<p>Full architectural design for residential, commercial, and public projects — from first concept to buildable drawings.</p><p>We focus on function, circulation, daylight, and climate, with a clear aesthetic identity.</p><p><strong>Includes:</strong></p><ul><li>Site and program study</li><li>Concept and preliminary plans</li><li>Detailed architectural drawings</li><li>Coordination with other disciplines when needed</li><li>Visual presentation to support decisions</li></ul><p>Tools: AutoCAD · Revit · SketchUp and more.</p>`,
      specs: [['Type','Residential / Commercial / Public'],['Deliverables','Drawings + visuals'],['Tools','Revit · AutoCAD']]
    },
    interior: {
      title: 'Interior Design',
      meta: 'Spaces · materials · lighting · furniture',
      body: `<p>Interior design that links function and beauty: layout, materials, colors, lighting, and furniture for how the client lives and uses the space.</p><p><strong>Includes:</strong></p><ul><li>Needs and lifestyle analysis</li><li>Furniture and circulation plans</li><li>Mood board</li><li>Execution details</li><li>Furniture, lighting, and 3D suggestions</li></ul>`,
      specs: [['Type','Residential / Office'],['Deliverables','Plans + Mood Board'],['Tools','3ds Max · AutoCAD']]
    },
    visualization: {
      title: '3D Visualization',
      meta: 'High-quality architectural renders',
      body: `<p>Renders and visuals that help clients and investors see the project before construction: realistic light, materials, and indoor/outdoor views.</p><p><strong>Includes:</strong></p><ul><li>3D modeling from drawings</li><li>High-quality exterior and interior renders</li><li>Day and night scenes</li><li>Optional short video or walkthrough</li><li>Revisions to light and materials</li></ul>`,
      specs: [['Type','Render / Video'],['Deliverables','High-res images'],['Tools','3ds Max · V-Ray']]
    }
  };
  function renderService() {
    const lang = (window.DEZN_I18N && window.DEZN_I18N.getLang()) || 'ar';
    const base = SERVICES[id] || SERVICES.architecture;
    const en = SERVICES_EN[id] || SERVICES_EN.architecture;
    const s = lang === 'en' ? Object.assign({}, base, en) : base;
    document.title = s.title + ' | DEZN';
    document.getElementById('title').textContent = s.title;
    document.getElementById('bcTitle').textContent = s.title;
    document.getElementById('meta').textContent = s.meta;
    document.getElementById('body').innerHTML = s.body;
    document.getElementById('specs').innerHTML = s.specs.map(([k,v]) =>
      `<div class="spec-item"><strong>${k}</strong><span>${v}</span></div>`
    ).join('');
  }

  const id = new URLSearchParams(location.search).get('id') || 'architecture';
  renderService();
  window.addEventListener('dezn-lang', renderService);
  </script>
  <script src="./script.js"></script>
</body>
</html>
